<!DOCTYPE html>

<html>

<head>

    <title>House Price Prediction</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

<h1>California House Price Prediction</h1>

<form action="/predict" method="post">

<input type="number" step="any" name="longitude" placeholder="Longitude" required>

<input type="number" step="any" name="latitude" placeholder="Latitude" required>

<input type="number" name="housing_median_age" placeholder="Housing Median Age" required>

<input type="number" name="total_rooms" placeholder="Total Rooms" required>

<input type="number" name="total_bedrooms" placeholder="Total Bedrooms" required>

<input type="number" name="population" placeholder="Population" required>

<input type="number" name="households" placeholder="Households" required>

<input type="number" step="any" name="median_income" placeholder="Median Income" required>

<select name="ocean_proximity">

<option value="<1H OCEAN">Location</option>

<option value="INLAND">INLAND</option>

<option value="ISLAND">ISLAND</option>

<option value="NEAR BAY">NEAR BAY</option>

<option value="NEAR OCEAN">NEAR OCEAN</option>

</select>

<button type="submit">

Predict Price

</button>

</form>

{% if prediction %}

<div class="prediction">

Predicted House Price

<br><br>

<h2>${{prediction}}</h2>

</div>

{% endif %}

</div>

</body>

</html>
